name: Check PO Files

on:
  push:
    branches:
      - master
  pull_request:
    branches: ["*"]

jobs:
  check-po:
    runs-on: ubuntu-latest
    name: Check PO Files
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Check PO files
        run: pnpm check:po
