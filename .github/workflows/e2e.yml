name: E2E

on:
  push:
    branches:
      - master
  pull_request:
    branches: ["**"]
    types: [opened, reopened, synchronize, labeled]

jobs:
  e2e:
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'labeled' &&
       github.event.pull_request.author_association == 'OWNER') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'run-e2e')
    runs-on: ubuntu-latest
    name: pnpm test:e2e
    env:
      CI: true
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start MongoDB replica set
        run: |
          trap 'echo "--- docker ps -a ---"; docker ps -a; echo "--- mongo logs ---"; docker logs mongo' ERR

          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          sleep 3

          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'

          for i in $(seq 1 30); do
            STATE=$(docker exec mongo mongosh --quiet --eval "rs.status().myState" 2>/dev/null || echo "0")
            if [ "$STATE" = "1" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "MongoDB replica set did not become PRIMARY" >&2
          exit 1
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install-deps chromium
          fi

      - name: Run E2E tests
        env:
          DB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
          DB_NAME: pfa_test
          RECAPTCHA_SECRET: e2e-dummy-recaptcha-secret
          NEXT_PUBLIC_RECAPTCHA: e2e-dummy-recaptcha-site-key
          CRON_SECRET: e2e-dummy-cron-secret
          CURRENCY_API_SECRET: e2e-dummy-currency-api-secret
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -base64 32)" pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
